<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 · Jacob Vogan</title>
  <meta name="description" content="404 — page not found." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#ECEEE9" />

  <link rel="icon" type="image/png" sizes="64x64" href="media/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="media/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --plate: #ECEEE9;
      --face: #F7F8F5;
      --ink: #101B1E;
      --ink-2: #4A5553;
      --ink-3: #7F8A87;
      --hair: #CBD1CC;
      --hair-strong: #A8B0AC;
      --accent: #D63A6A;
      --font-sans: "Archivo", ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --radius: 6px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--plate);
      color: var(--ink);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      min-height: 100vh;
    }
    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    .card {
      background: var(--face);
      border: 1px solid var(--hair-strong);
      border-radius: var(--radius);
      max-width: 680px;
      width: 100%;
      padding: 40px 48px 36px;
    }
    .label {
      font-stretch: 75%;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-2);
    }
    .mark {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 36px;
    }
    .mark .name { font-stretch: 125%; font-weight: 700; color: var(--ink); }
    .mark .rule { flex: 1; height: 1px; background: var(--hair); }

    /* An empty well row: nothing was plated here. */
    .wells {
      display: flex;
      gap: 12px;
      margin-bottom: 26px;
    }
    .well {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid var(--hair-strong);
      background: radial-gradient(circle at 50% 50%, #F1F2EF 0 58%, #E2E5E0 100%);
      box-shadow: inset 0 1px 3px rgba(16, 27, 30, 0.10);
    }

    .four {
      font-stretch: 125%;
      font-weight: 800;
      font-size: clamp(96px, 18vw, 168px);
      line-height: 0.9;
      letter-spacing: -0.02em;
      margin: 0 0 18px;
      color: var(--ink);
    }
    .four .accent { color: var(--accent); }

    .lead {
      font-size: 18px;
      line-height: 1.5;
      color: var(--ink);
      max-width: 520px;
      margin: 0 0 8px;
    }
    .body {
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink-2);
      max-width: 520px;
      margin: 0 0 28px;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 11px 16px;
      border: 1px solid var(--ink);
      border-radius: var(--radius);
      text-decoration: none;
      color: var(--ink);
      background: transparent;
      transition: background 140ms ease, color 140ms ease, border-color 140ms ease;
    }
    .btn:hover { background: var(--ink); color: var(--face); }
    .btn.primary { background: var(--ink); color: var(--face); }
    .btn.primary:hover { background: var(--accent); border-color: var(--accent); }
    .btn .arrow { font-family: var(--font-mono); }

    .log {
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid var(--hair);
      display: flex;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
      color: var(--ink-3);
    }
    .log .mono { font-family: var(--font-mono); font-weight: 500; letter-spacing: 0; text-transform: none; }

    :focus { outline: none; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

    @media (max-width: 640px) {
      .card { padding: 28px 24px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <article class="card">
      <div class="mark label">
        <span class="name">Jacob Vogan</span>
        <span class="rule" aria-hidden="true"></span>
        <span>Bio × AI</span>
      </div>

      <div class="wells" aria-hidden="true">
        <span class="well"></span><span class="well"></span><span class="well"></span><span class="well"></span>
      </div>

      <h1 class="four"><span>4</span><span class="accent">0</span><span>4</span></h1>

      <p class="lead">Page not found.</p>
      <p class="body">
        Nothing was plated at this address. It may have moved, or it may not exist yet.
      </p>

      <div class="actions label">
        <a class="btn primary" href="/">
          <span>Home</span>
          <span class="arrow">→</span>
        </a>
        <a class="btn" href="https://github.com/jvogan" target="_blank" rel="noopener noreferrer">
          <span>github.com/jvogan</span>
          <span class="arrow">↗</span>
        </a>
      </div>

      <div class="log label">
        <span>Error <span class="mono">404</span></span>
        <span>Jacob Vogan</span>
      </div>
    </article>
  </main>
</body>
</html>
